
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feane - Admin Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f5f7;
            color: #222;
        }

        header {
            background: #222831;
            color: white;
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            color: #ffbe33;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .logout-btn {
            padding: 9px 15px;
            background: #ffbe33;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            padding: 35px 6%;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading h1 {
            margin-bottom: 8px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000010;
        }

        .stat-card h3 {
            color: #666;
            font-size: 15px;
            margin-bottom: 12px;
        }

        .stat-card p {
            font-size: 28px;
            font-weight: bold;
        }

        .table-container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            overflow-x: auto;
        }

        .table-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .refresh-btn {
            padding: 10px 18px;
            background: #ffbe33;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #222831;
            color: white;
        }

        .status {
            padding: 6px 10px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
        }

        .pending {
            background: #fff0c2;
            color: #9a6b00;
        }

        .confirmed {
            background: #d8f5df;
            color: #168039;
        }

        .cancelled {
            background: #ffe0e0;
            color: #c62828;
        }

        .attend-btn {
            padding: 8px 12px;
            background: #168039;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .attend-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .empty-message {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        .error-message {
            color: red;
        }

        @media (max-width: 600px) {
            header {
                padding: 18px 5%;
            }

            .container {
                padding: 25px 4%;
            }

            .header-actions {
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>Feane Admin</h2>

        <div class="header-actions">
            <a href="index.html">Website</a>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>

    <main class="container">

        <div class="heading">
            <h1>Admin Dashboard</h1>
            <p>Manage your restaurant table reservations.</p>
        </div>

        <div class="stats">

            <div class="stat-card">
                <h3>Total Bookings</h3>
                <p id="totalBookings">0</p>
            </div>

            <div class="stat-card">
                <h3>Pending</h3>
                <p id="pendingBookings">0</p>
            </div>

            <div class="stat-card">
                <h3>Confirmed</h3>
                <p id="confirmedBookings">0</p>
            </div>

            <div class="stat-card">
                <h3>Cancelled</h3>
                <p id="cancelledBookings">0</p>
            </div>

        </div>

        <div class="table-container">

            <div class="table-top">
                <h2>All Reservations</h2>

                <button class="refresh-btn" onclick="loadReservations()">
                    Refresh Data
                </button>
            </div>

            <table>

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Persons</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="reservationTable">
                    <tr>
                        <td colspan="7" class="empty-message">
                            Loading reservations...
                        </td>
                    </tr>
                </tbody>

            </table>

        </div>

    </main>

    <script>

        const adminToken = sessionStorage.getItem("adminToken");

        // LOGIN CHECK
        if (!adminToken) {
            window.location.replace("admin-login.html");
        }

        // LOGOUT
        function logout() {
            sessionStorage.removeItem("adminToken");
            window.location.replace("admin-login.html");
        }

        // LOAD RESERVATIONS
        async function loadReservations() {

            const table = document.getElementById("reservationTable");

            table.innerHTML = `
                <tr>
                    <td colspan="7" class="empty-message">
                        Loading reservations...
                    </td>
                </tr>
            `;

            try {

                const response = await fetch(
                    "http://localhost:5000/api/reservations",
                    {
                        headers: {
                            "Authorization": "Bearer " + adminToken
                        }
                    }
                );

                if (response.status === 401 || response.status === 403) {
                    logout();
                    return;
                }

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.message || "Unable to fetch bookings");
                }

                const reservations = result.reservations || [];

                document.getElementById("totalBookings").textContent =
                    reservations.length;

                document.getElementById("pendingBookings").textContent =
                    reservations.filter(r => r.status === "Pending").length;

                document.getElementById("confirmedBookings").textContent =
                    reservations.filter(r => r.status === "Confirmed").length;

                document.getElementById("cancelledBookings").textContent =
                    reservations.filter(r => r.status === "Cancelled").length;

                if (reservations.length === 0) {
                    table.innerHTML = `
                        <tr>
                            <td colspan="7" class="empty-message">
                                No bookings found.
                            </td>
                        </tr>
                    `;
                    return;
                }

                table.innerHTML = "";

                reservations.forEach(reservation => {

                    const row = document.createElement("tr");

                    const status = reservation.status || "Pending";

                    const date = new Date(reservation.date)
                        .toLocaleDateString("en-IN");

                    const values = [
                        reservation.name,
                        reservation.phone,
                        reservation.email,
                        reservation.persons,
                        date
                    ];

                    values.forEach(value => {
                        const cell = document.createElement("td");
                        cell.textContent = value ?? "";
                        row.appendChild(cell);
                    });

                    const statusCell = document.createElement("td");

                    const badge = document.createElement("span");
                    badge.className = "status " + status.toLowerCase();
                    badge.textContent = status;

                    statusCell.appendChild(badge);
                    row.appendChild(statusCell);

                    const actionCell = document.createElement("td");

                    if (status === "Pending") {

                        const attendButton = document.createElement("button");

                        attendButton.className = "attend-btn";
                        attendButton.textContent = "Attend & Confirm";

                        attendButton.addEventListener("click", () => {
                            confirmBooking(reservation._id, attendButton);
                        });

                        actionCell.appendChild(attendButton);

                    } else {
                        actionCell.textContent =
                            status === "Confirmed" ? "Attended" : "No Action";
                    }

                    row.appendChild(actionCell);
                    table.appendChild(row);

                });

            } catch (error) {

                console.error("Dashboard Error:", error);

                table.innerHTML = `
                    <tr>
                        <td colspan="7" class="empty-message error-message">
                            Unable to load bookings. Please check backend server.
                        </td>
                    </tr>
                `;

            }
        }

        // CONFIRM ATTENDED BOOKING
        async function confirmBooking(id, button) {

            const confirmed = window.confirm(
                "Kya customer restaurant aa chuka hai aur booking attend ho gayi hai?"
            );

            if (!confirmed) return;

            try {

                button.disabled = true;
                button.textContent = "Please wait...";

                const response = await fetch(
                    `http://localhost:5000/api/reservations/${id}/confirm`,
                    {
                        method: "PATCH",
                        headers: {
                            "Authorization": "Bearer " + adminToken
                        }
                    }
                );

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.message || "Confirmation failed");
                }

                alert("Booking successfully confirmed!");

                await loadReservations();

            } catch (error) {

                alert(error.message);
                button.disabled = false;
                button.textContent = "Attend & Confirm";

            }
        }

        // INITIAL LOAD
        if (adminToken) {
            loadReservations();
        }

    </script>

</body>
</html>
